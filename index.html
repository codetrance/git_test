<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="button-container">
      <button class="rock" id="rock">ROCK</button>
      <button class="paper" id="paper">PAPER</button>
      <button class="scissors" id="scissors">SCISSORS</button>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // document.getElementById("rock").addEventListener("click", function () {
        //   handleClick("ROCK");
        // });
        // document.getElementById("paper").addEventListener("click", function () {
        //   handleClick("PAPER");
        // });
        // document
        //   .getElementById("scissors")
        //   .addEventListener("click", function () {
        //     handleClick("SCISSORS");
        //   });
        // document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", handleClick);
        });
      });
      let humanChoice = "";
      function handleClick(event) {
        humanChoice = event.target.id.toUpperCase();
        console.log(humanChoice + " clicked!");
        document.body.style.backgroundColor =
          humanChoice === "ROCK"
            ? "#ffcccb"
            : humanChoice === "PAPER"
            ? "#ccffcb"
            : "#cbccff";
        return humanChoice;
      }

      // let humanChoice = "y";
      // function getHumanChoice() {
      //   humanChoice = window
      //     .prompt("Choose an option - Rock, Paper, Scissors")
      //     .toLowerCase();
      //   console.log("Human Chose :", humanChoice);
      // }
      let computerChoice = "x";
      function getComputerChoice() {
        let result = Math.random();
        if (result >= 0 && result <= 0.3) {
          computerChoice = "Rock".toLowerCase();
          console.log("Computer Chose :", computerChoice);
          return;
        } else if (result > 0.3 && result <= 0.7) {
          computerChoice = "Paper".toLowerCase();
          console.log("Computer Chose :", computerChoice);
          return;
        } else {
          computerChoice = "Scissors".toLowerCase();
          console.log("Computer Chose :", computerChoice);
          return;
        }
      }

      let humanScore = 0;
      let computerScore = 0;

      // Take the choice from human (make it case sensitive)
      // Take the choice from computer (make it case sensitive)
      // Play first round by comparing choice of human and computer, playRound function
      function playRound(humanChoice, computerChoice) {
        if (humanChoice == computerChoice) {
          console.log("It's a tie, let's play again!");
          // console.log("What value of humanChoice", humanChoice);
          // console.log("What value of computerChoice", computerChoice);
          return;
        } else if (
          (humanChoice == "rock" && computerChoice == "scissors") ||
          (humanChoice == "scissors" && computerChoice == "paper") ||
          (humanChoice == "paper" && computerChoice == "rock")
        ) {
          humanScore += 1;
          console.log("You win :", humanScore);
          return;
        } else {
          console.log("You lose!");
          return;
        }
        console.log("humanScore :", humanScore);
        console.log("computerScore :", computerScore);
      }
      // Based on who won, update the score for human OR computer
      // Play this round 5 times, by adding this into a function to call 5 times
      function playGame(rounds) {
        for (let round = 1; round <= rounds; round++) {
          getHumanChoice();
          getComputerChoice();
          playRound(humanChoice, computerChoice);
          console.log("Round :", round);
          console.log("Your score so far is:", humanScore);
          // return;
        }
        console.log("You scored overall:", humanScore);
      }

      // playRound(humanChoice, computerChoice);
      playGame(5);
      console.log("Human Chose :", humanChoice);
      console.log("Computer Chose :", computerChoice);
    </script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        /* width: 20px; */
        background-color: #f4f4f4;
      }
      .button-container {
        display: flex;
        gap: 10px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }
      .rock {
        background-color: grey;
        color: white;
      }
      .paper {
        background-color: black;
        color: white;
      }
      .scissors {
        background-color: teal;
        color: white;
      }
    </style>
  </body>
</html>
